<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaflet Mapbox Satellite Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 10px 14px;
      background: #1f2937;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }

    #search-form {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    #search-input {
      width: min(320px, 60vw);
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    #map {
      flex: 1;
      min-height: 0;
    }

    #status {
      position: absolute;
      z-index: 1000;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.85);
      color: white;
      font-size: 0.8rem;
      display: none;
    }

    .leaflet-control-attribution {
      font-size: 10px;
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <h1>Leaflet + Mapbox</h1>

      <form id="search-form">
        <input
          id="search-input"
          type="text"
          placeholder="Search a place, e.g. Forrestfield, WA"
          autocomplete="off"
        />
        <button type="submit">Search</button>
      </form>
    </header>

    <div id="map"></div>
    <div id="status"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Create mapbox.local.js as described in the README. This file is ignored by Git. -->
  <script src="./mapbox.local.js"></script>
  <script>
    const MAPBOX_TOKEN = window.MAPBOX_TOKEN || "";

    const map = L.map("map", {
      center: [-31.995, 115.98], // Near Forrestfield, WA
      zoom: 12,
      zoomControl: true
    });

    const satellite = L.tileLayer(
      `https://api.mapbox.com/v4/mapbox.satellite/{z}/{x}/{y}@2x.jpg90?access_token=${MAPBOX_TOKEN}`,
      {
        maxZoom: 22,
        attribution:
          '&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> &copy; <a href="https://www.maxar.com/">Maxar</a>'
      }
    );

    const satelliteStreets = L.tileLayer(
      `https://api.mapbox.com/styles/v1/mapbox/satellite-streets-v12/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`,
      {
        tileSize: 512,
        zoomOffset: -1,
        maxZoom: 22,
        attribution:
          '&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }
    );

    const streets = L.tileLayer(
      `https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`,
      {
        tileSize: 512,
        zoomOffset: -1,
        maxZoom: 22,
        attribution:
          '&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }
    );

    satellite.addTo(map);

    L.control.layers(
      {
        "Satellite": satellite,
        "Satellite + roads": satelliteStreets,
        "Streets": streets
      },
      {},
      { collapsed: false }
    ).addTo(map);

    L.control.scale({ imperial: false }).addTo(map);

    const status = document.getElementById("status");

    function showStatus(message) {
      status.textContent = message;
      status.style.display = "block";
    }

    function hideStatus() {
      status.style.display = "none";
    }

    if (!MAPBOX_TOKEN) {
      showStatus("Mapbox token missing. See the README to configure mapbox.local.js.");
    }

    let marker = null;

    map.on("click", (event) => {
      const { lat, lng } = event.latlng;

      if (marker) {
        marker.setLatLng(event.latlng);
      } else {
        marker = L.marker(event.latlng).addTo(map);
      }

      marker
        .bindPopup(
          `<strong>Selected location</strong><br>${lat.toFixed(5)}, ${lng.toFixed(5)}`
        )
        .openPopup();
    });

    document
      .getElementById("search-form")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const query = document
          .getElementById("search-input")
          .value.trim();

        if (!query) return;
        if (!MAPBOX_TOKEN) {
          showStatus("Mapbox token missing. See the README to configure mapbox.local.js.");
          return;
        }

        showStatus("Searching…");

        try {
          const response = await fetch(
            `https://api.mapbox.com/search/geocode/v6/forward?q=${encodeURIComponent(
              query
            )}&access_token=${MAPBOX_TOKEN}&limit=1`
          );

          if (!response.ok) {
            throw new Error(`Geocoding failed (${response.status})`);
          }

          const data = await response.json();
          const feature = data.features?.[0];

          if (!feature) {
            showStatus("No matching place found.");
            return;
          }

          const [lng, lat] = feature.geometry.coordinates;

          map.setView([lat, lng], 15);

          if (marker) {
            marker.setLatLng([lat, lng]);
          } else {
            marker = L.marker([lat, lng]).addTo(map);
          }

          marker
            .bindPopup(`<strong>${feature.properties.name}</strong>`)
            .openPopup();

          hideStatus();
        } catch (error) {
          console.error(error);
          showStatus("Search failed. Check the browser console for details.");
        }
      });
  </script>
</body>
</html>
